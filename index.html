<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
/>

<title>Controle de Despesas</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f3f4f6;
    padding:15px;
}

.container{
    max-width:1400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:18px;
    box-shadow:0 5px 18px rgba(0,0,0,0.08);
}

h1{
    text-align:center;
    margin-bottom:25px;
    color:#1f2937;
    font-size:28px;
}

.section-title{
    margin-top:25px;
    margin-bottom:15px;
    font-size:18px;
    font-weight:bold;
    color:#374151;
}

.info-box{
    background:#eff6ff;
    border:1px solid #bfdbfe;
    color:#1d4ed8;
    padding:14px;
    border-radius:10px;
    margin-bottom:20px;
    font-size:14px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:6px;
    font-weight:bold;
    color:#374151;
    font-size:14px;
}

input,
select{
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:10px;
    font-size:15px;
    background:white;
}

input:focus,
select:focus{
    outline:none;
    border-color:#2563eb;
}

button{
    border:none;
    padding:14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
    transition:0.2s;
    font-size:15px;
}

.primary{
    background:#2563eb;
    color:white;
}

.primary:hover{
    background:#1d4ed8;
}

.success{
    background:#16a34a;
    color:white;
}

.success:hover{
    background:#15803d;
}

.danger{
    background:#dc2626;
    color:white;
    padding:8px 12px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:25px;
    flex-wrap:wrap;
}

.table-wrapper{
    overflow-x:auto;
    margin-top:20px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:1000px;
}

table th,
table td{
    border:1px solid #e5e7eb;
    padding:12px;
    text-align:center;
    font-size:14px;
}

table th{
    background:#f3f4f6;
}

.preview-img{
    width:80px;
    border-radius:8px;
}

.total{
    margin-top:20px;
    font-size:24px;
    text-align:right;
    font-weight:bold;
    color:#111827;
}

@media(max-width:768px){

    body{
        padding:10px;
    }

    .container{
        padding:15px;
    }

    h1{
        font-size:22px;
    }

    .actions{
        flex-direction:column;
    }

    button{
        width:100%;
    }

    table th,
    table td{
        font-size:13px;
        padding:10px;
    }

    .preview-img{
        width:65px;
    }
}

</style>

</head>

<body>

<div class="container">

<h1>Controle de Despesas de Viagem</h1>

<div class="info-box">
    Os dados da viagem ficam salvos automaticamente no navegador.
</div>

<div class="section-title">
    Dados da Viagem
</div>

<div class="form-grid">

    <div class="field">

        <label>Funcionário</label>

        <input
            type="text"
            id="funcionario"
        >

    </div>

    <div class="field">

        <label>Cliente</label>

        <input
            type="text"
            id="cliente"
        >

    </div>

    <div class="field">

        <label>Data Início</label>

        <input
            type="date"
            id="dataInicio"
        >

    </div>

    <div class="field">

        <label>Data Final</label>

        <input
            type="date"
            id="dataFim"
        >

    </div>

</div>

<div class="section-title">
    Nova Despesa
</div>

<div class="form-grid">

    <div class="field">

        <label>Data do Cupom</label>

        <input
            type="date"
            id="dataCupom"
        >

    </div>

    <div class="field">

        <label>Categoria</label>

        <select id="categoria">

            <option>Refeição</option>
            <option>Hotel</option>
            <option>Combustível</option>
            <option>Pedágio</option>
            <option>Táxi/Uber</option>
            <option>Outros</option>

        </select>

    </div>

    <div class="field">

        <label>Descrição</label>

        <input
            list="historicoDescricao"
            type="text"
            id="descricao"
        >

        <datalist id="historicoDescricao"></datalist>

    </div>

    <div class="field">

        <label>Valor</label>

        <input
            type="number"
            step="0.01"
            id="valor"
        >

    </div>

    <div class="field">

        <label>Anexar Imagem</label>

        <input
            type="file"
            id="imagem"
            accept="image/*"
        >

    </div>

    <div class="field">

        <label>Tirar Foto</label>

        <input
            type="file"
            id="camera"
            accept="image/*"
            capture="environment"
        >

    </div>

</div>

<div class="actions">

    <button
        class="primary"
        onclick="salvarDespesa()"
    >
        Salvar Despesa
    </button>

    <button
        class="success"
        onclick="exportarExcel()"
    >
        Exportar Excel
    </button>

    <button
        class="success"
        onclick="exportarPDF()"
    >
        Exportar PDF
    </button>

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

    <th>Funcionário</th>

    <th>Cliente</th>

    <th>Período</th>

    <th>Data Cupom</th>

    <th>Categoria</th>

    <th>Descrição</th>

    <th>Valor</th>

    <th>Cupom</th>

    <th>Ação</th>

</tr>

</thead>

<tbody id="tabelaDespesas"></tbody>

</table>

</div>

<div
    class="total"
    id="total"
>
    Total: R$ 0,00
</div>

</div>

<script>

let despesas =
    JSON.parse(
        localStorage.getItem("despesas")
    ) || [];

let descricoes =
    JSON.parse(
        localStorage.getItem("descricoes")
    ) || [];

carregarDadosViagem();

renderizarTabela();

renderizarDescricoes();

function primeiraMaiuscula(texto){

    if(!texto) return "";

    texto = texto.toLowerCase();

    return texto.charAt(0).toUpperCase()
        + texto.slice(1);
}

function salvarDadosViagem(){

    const dados = {

        funcionario:
            document.getElementById(
                "funcionario"
            ).value,

        cliente:
            document.getElementById(
                "cliente"
            ).value,

        dataInicio:
            document.getElementById(
                "dataInicio"
            ).value,

        dataFim:
            document.getElementById(
                "dataFim"
            ).value,

        dataCupom:
            document.getElementById(
                "dataCupom"
            ).value
    };

    localStorage.setItem(
        "dadosViagem",
        JSON.stringify(dados)
    );
}

function carregarDadosViagem(){

    const dados =
        JSON.parse(
            localStorage.getItem(
                "dadosViagem"
            )
        );

    if(!dados) return;

    document.getElementById(
        "funcionario"
    ).value =
        dados.funcionario || "";

    document.getElementById(
        "cliente"
    ).value =
        dados.cliente || "";

    document.getElementById(
        "dataInicio"
    ).value =
        dados.dataInicio || "";

    document.getElementById(
        "dataFim"
    ).value =
        dados.dataFim || "";

    document.getElementById(
        "dataCupom"
    ).value =
        dados.dataCupom || "";
}

[
    "funcionario",
    "cliente",
    "dataInicio",
    "dataFim",
    "dataCupom"
].forEach(id => {

    document
        .getElementById(id)
        .addEventListener(
            "change",
            salvarDadosViagem
        );

});

function salvarDespesa(){

    const funcionario =
        primeiraMaiuscula(
            document.getElementById(
                "funcionario"
            ).value
        );

    const cliente =
        primeiraMaiuscula(
            document.getElementById(
                "cliente"
            ).value
        );

    const dataInicio =
        document.getElementById(
            "dataInicio"
        ).value;

    const dataFim =
        document.getElementById(
            "dataFim"
        ).value;

    const dataCupom =
        document.getElementById(
            "dataCupom"
        ).value;

    const categoria =
        document.getElementById(
            "categoria"
        ).value;

    const descricao =
        primeiraMaiuscula(
            document.getElementById(
                "descricao"
            ).value
        );

    const valor =
        document.getElementById(
            "valor"
        ).value;

    const imagemInput =
        document.getElementById(
            "imagem"
        );

    const cameraInput =
        document.getElementById(
            "camera"
        );

    if(
        !funcionario ||
        !cliente ||
        !dataInicio ||
        !dataFim ||
        !dataCupom ||
        !valor
    ){
        alert(
            "Preencha os campos obrigatórios"
        );
        return;
    }

    salvarDadosViagem();

    if(
        descricao &&
        !descricoes.includes(descricao)
    ){

        descricoes.push(descricao);

        localStorage.setItem(
            "descricoes",
            JSON.stringify(descricoes)
        );

        renderizarDescricoes();
    }

    const arquivoImagem =
        imagemInput.files[0]
        || cameraInput.files[0];

    const reader = new FileReader();

    reader.onload = function(){

        const despesa = {

            funcionario,
            cliente,
            dataInicio,
            dataFim,
            dataCupom,
            categoria,
            descricao,
            valor,
            imagem:
                reader.result || ""
        };

        despesas.push(despesa);

        localStorage.setItem(
            "despesas",
            JSON.stringify(despesas)
        );

        renderizarTabela();

        limparFormulario();
    };

    if(arquivoImagem){

        reader.readAsDataURL(
            arquivoImagem
        );

    }else{

        reader.onload();
    }
}

function renderizarDescricoes(){

    const lista =
        document.getElementById(
            "historicoDescricao"
        );

    lista.innerHTML = "";

    descricoes.forEach(item => {

        lista.innerHTML += `
            <option value="${item}">
        `;
    });
}

function renderizarTabela(){

    const tabela =
        document.getElementById(
            "tabelaDespesas"
        );

    tabela.innerHTML = "";

    let total = 0;

    despesas.forEach((despesa,index)=>{

        total += parseFloat(
            despesa.valor
        );

        tabela.innerHTML += `

        <tr>

            <td>${despesa.funcionario}</td>

            <td>${despesa.cliente}</td>

            <td>
                ${despesa.dataInicio}
                até
                ${despesa.dataFim}
            </td>

            <td>${despesa.dataCupom}</td>

            <td>${despesa.categoria}</td>

            <td>${despesa.descricao}</td>

            <td>
                R$ ${parseFloat(
                    despesa.valor
                ).toFixed(2)}
            </td>

            <td>

                ${
                    despesa.imagem
                    ? `
                    <img
                        class="preview-img"
                        src="${despesa.imagem}"
                    >
                    `
                    : "Sem imagem"
                }

            </td>

            <td>

                <button
                    class="danger"
                    onclick="
                        removerDespesa(
                            ${index}
                        )
                    "
                >
                    Excluir
                </button>

            </td>

        </tr>

        `;
    });

    document.getElementById(
        "total"
    ).innerHTML =
        `Total: R$ ${total.toFixed(2)}`;
}

function removerDespesa(index){

    if(
        confirm(
            "Deseja remover esta despesa?"
        )
    ){

        despesas.splice(index,1);

        localStorage.setItem(
            "despesas",
            JSON.stringify(despesas)
        );

        renderizarTabela();
    }
}

function limparFormulario(){

    document.getElementById(
        "descricao"
    ).value = "";

    document.getElementById(
        "valor"
    ).value = "";

    document.getElementById(
        "imagem"
    ).value = "";

    document.getElementById(
        "camera"
    ).value = "";
}

function exportarExcel(){

    const worksheet =
        XLSX.utils.json_to_sheet(
            despesas
        );

    const workbook =
        XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Despesas"
    );

    XLSX.writeFile(
        workbook,
        "despesas_viagem.xlsx"
    );
}

async function exportarPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    let y = 20;

    doc.setFillColor(37,99,235);

    doc.rect(
        0,
        0,
        220,
        20,
        "F"
    );

    doc.setTextColor(
        255,
        255,
        255
    );

    doc.setFontSize(18);

    doc.text(
        "Relatório de Despesas",
        14,
        13
    );

    y = 30;

    let total = 0;

    despesas.forEach((d,index)=>{

        total += parseFloat(d.valor);

        if(y > 240){

            doc.addPage();

            y = 20;
        }

        doc.setDrawColor(200);

        doc.roundedRect(
            10,
            y,
            190,
            58,
            3,
            3
        );

        doc.setFillColor(
            243,
            244,
            246
        );

        doc.roundedRect(
            10,
            y,
            190,
            10,
            3,
            3,
            "F"
        );

        doc.setTextColor(
            0,
            0,
            0
        );

        doc.setFontSize(12);

        doc.text(
            `Despesa #${index + 1}`,
            14,
            y + 7
        );

        doc.setFontSize(10);

        let linha = y + 18;

        doc.text(
            `Funcionário: ${d.funcionario}`,
            14,
            linha
        );

        linha += 6;

        doc.text(
            `Cliente: ${d.cliente}`,
            14,
            linha
        );

        linha += 6;

        doc.text(
            `Período: ${d.dataInicio} até ${d.dataFim}`,
            14,
            linha
        );

        linha += 6;

        doc.text(
            `Data Cupom: ${d.dataCupom}`,
            14,
            linha
        );

        linha += 6;

        doc.text(
            `Categoria: ${d.categoria}`,
            14,
            linha
        );

        linha += 6;

        doc.text(
            `Descrição: ${d.descricao}`,
            14,
            linha
        );

        linha += 6;

        doc.setFontSize(11);

        doc.text(
            `Valor: R$ ${parseFloat(
                d.valor
            ).toFixed(2)}`,
            14,
            linha
        );

        if(d.imagem){

            try{

                doc.addImage(
                    d.imagem,
                    "JPEG",
                    145,
                    y + 15,
                    42,
                    32
                );

            }catch(e){

                console.log(
                    "Erro imagem"
                );
            }
        }

        y += 68;

    });

    if(y > 250){

        doc.addPage();

        y = 20;
    }

    doc.setFillColor(
        22,
        163,
        74
    );

    doc.roundedRect(
        10,
        y,
        190,
        14,
        3,
        3,
        "F"
    );

    doc.setTextColor(
        255,
        255,
        255
    );

    doc.setFontSize(14);

    doc.text(
        `TOTAL GERAL: R$ ${total.toFixed(2)}`,
        14,
        y + 9
    );

    doc.save(
        "despesas_viagem.pdf"
    );
}

</script>

</body>
</html>
