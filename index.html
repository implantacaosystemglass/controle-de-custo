<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Despesas</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial;
    }

    body {
      background: #f5f5f5;
      padding: 20px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-bottom: 20px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    label {
      margin-bottom: 5px;
      font-weight: bold;
    }

    input,
    select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    button {
      padding: 12px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: white;
      font-weight: bold;
    }

    .salvar {
      background: #007bff;
    }

    .excel {
      background: #28a745;
    }

    .pdf {
      background: #dc3545;
    }

    .delete-btn {
      background: #999;
      padding: 8px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      overflow-x: auto;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }

    th {
      background: #f0f0f0;
    }

    img {
      width: 70px;
      border-radius: 5px;
    }

    .total {
      margin-top: 20px;
      text-align: right;
      font-size: 20px;
      font-weight: bold;
    }

    @media(max-width:768px) {
      table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Controle de Despesas de Viagem</h1>

    <div class="grid">

      <div class="field">
        <label>Funcionário</label>
        <input type="text" id="funcionario">
      </div>

      <div class="field">
        <label>Cliente</label>
        <input type="text" id="cliente">
      </div>

      <div class="field">
        <label>Data Início Viagem</label>
        <input type="date" id="inicioViagem">
      </div>

      <div class="field">
        <label>Data Final Viagem</label>
        <input type="date" id="fimViagem">
      </div>

      <div class="field">
        <label>Data do Cupom</label>
        <input type="date" id="dataCupom">
      </div>

      <div class="field">
        <label>Categoria</label>
        <select id="categoria">
          <option>Refeição</option>
          <option>Hotel</option>
          <option>Combustível</option>
          <option>Pedágio</option>
          <option>Uber/Táxi</option>
          <option>Outros</option>
        </select>
      </div>

      <div class="field">
        <label>Descrição</label>
        <input type="text" id="descricao" list="listaDescricao">
        <datalist id="listaDescricao"></datalist>
      </div>

      <div class="field">
        <label>Valor</label>
        <input type="number" id="valor" step="0.01">
      </div>

      <div class="field">
        <label>Cupom Fiscal</label>
        <input type="file" id="imagem" accept="image/*">
      </div>

    </div>

    <div class="buttons">
      <button class="salvar" onclick="salvarDespesa()">Salvar Despesa</button>
      <button class="excel" onclick="exportarExcel()">Exportar Excel</button>
      <button class="pdf" onclick="exportarPDF()">Exportar PDF</button>
    </div>

    <table>

      <thead>
        <tr>
          <th>Funcionário</th>
          <th>Cliente</th>
          <th>Período</th>
          <th>Data Cupom</th>
          <th>Categoria</th>
          <th>Descrição</th>
          <th>Valor</th>
          <th>Cupom</th>
          <th>Ação</th>
        </tr>
      </thead>

      <tbody id="tabelaDespesas"></tbody>

    </table>

    <div class="total" id="total">
      Total: R$ 0,00
    </div>

  </div>

  <script>

    let despesas = JSON.parse(localStorage.getItem("despesas")) || [];

    let descricoesSalvas = JSON.parse(localStorage.getItem("descricoes")) || [];

    atualizarDatalist();

    renderizarTabela();

    function primeiraMaiuscula(texto) {

      texto = texto.toLowerCase();

      return texto.charAt(0).toUpperCase() + texto.slice(1);
    }

    function atualizarDatalist() {

      const lista = document.getElementById("listaDescricao");

      lista.innerHTML = "";

      descricoesSalvas.forEach(desc => {

        lista.innerHTML += `
          <option value="${desc}">
        `;
      });
    }

    function salvarDespesa() {

      const funcionario = primeiraMaiuscula(document.getElementById("funcionario").value);

      const cliente = primeiraMaiuscula(document.getElementById("cliente").value);

      const inicioViagem = document.getElementById("inicioViagem").value;

      const fimViagem = document.getElementById("fimViagem").value;

      const dataCupom = document.getElementById("dataCupom").value;

      const categoria = document.getElementById("categoria").value;

      const descricao = primeiraMaiuscula(document.getElementById("descricao").value);

      const valor = document.getElementById("valor").value;

      const imagemInput = document.getElementById("imagem");

      if (
        !funcionario ||
        !cliente ||
        !inicioViagem ||
        !fimViagem ||
        !dataCupom ||
        !valor
      ) {
        alert("Preencha os campos obrigatórios");
        return;
      }

      if (!descricoesSalvas.includes(descricao)) {

        descricoesSalvas.push(descricao);

        localStorage.setItem(
          "descricoes",
          JSON.stringify(descricoesSalvas)
        );

        atualizarDatalist();
      }

      const reader = new FileReader();

      reader.onload = function () {

        const despesa = {
          funcionario,
          cliente,
          inicioViagem,
          fimViagem,
          dataCupom,
          categoria,
          descricao,
          valor,
          imagem: reader.result
        };

        despesas.push(despesa);

        localStorage.setItem(
          "despesas",
          JSON.stringify(despesas)
        );

        limparFormulario();

        renderizarTabela();
      }

      if (imagemInput.files[0]) {

        reader.readAsDataURL(imagemInput.files[0]);

      } else {

        reader.onload();
      }
    }

    function renderizarTabela() {

      const tabela = document.getElementById("tabelaDespesas");

      tabela.innerHTML = "";

      let total = 0;

      despesas.forEach((d, index) => {

        total += parseFloat(d.valor);

        tabela.innerHTML += `
        
          <tr>

            <td>${d.funcionario}</td>

            <td>${d.cliente}</td>

            <td>
              ${d.inicioViagem} <br>
              até <br>
              ${d.fimViagem}
            </td>

            <td>${d.dataCupom}</td>

            <td>${d.categoria}</td>

            <td>${d.descricao}</td>

            <td>
              R$ ${parseFloat(d.valor).toFixed(2)}
            </td>

            <td>
              ${d.imagem
              ? `<img src="${d.imagem}">`
              : `Sem imagem`
            }
            </td>

            <td>
              <button class="delete-btn"
                onclick="removerDespesa(${index})">
                Excluir
              </button>
            </td>

          </tr>
        `;
      });

      document.getElementById("total").innerHTML =
        `Total: R$ ${total.toFixed(2)}`;
    }

    function removerDespesa(index) {

      if (confirm("Deseja excluir esta despesa?")) {

        despesas.splice(index, 1);

        localStorage.setItem(
          "despesas",
          JSON.stringify(despesas)
        );

        renderizarTabela();
      }
    }

    function limparFormulario() {

      document.getElementById("dataCupom").value = "";
      document.getElementById("categoria").value = "Refeição";
      document.getElementById("descricao").value = "";
      document.getElementById("valor").value = "";
      document.getElementById("imagem").value = "";
    }

    function exportarExcel() {

      const dados = despesas.map(d => ({

        Funcionário: d.funcionario,

        Cliente: d.cliente,

        "Data Início": d.inicioViagem,

        "Data Final": d.fimViagem,

        "Data Cupom": d.dataCupom,

        Categoria: d.categoria,

        Descrição: d.descricao,

        Valor: d.valor

      }));

      const worksheet =
        XLSX.utils.json_to_sheet(dados);

      const workbook =
        XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Despesas"
      );

      XLSX.writeFile(
        workbook,
        "despesas_viagem.xlsx"
      );
    }

    async function exportarPDF() {

      const { jsPDF } = window.jspdf;

      const doc = new jsPDF();

      let y = 10;

      doc.setFontSize(16);

      doc.text("Relatório de Despesas", 10, y);

      y += 10;

      despesas.forEach((d, i) => {

        doc.setFontSize(10);

        doc.text(
          `
Funcionário: ${d.funcionario}
Cliente: ${d.cliente}
Período: ${d.inicioViagem} até ${d.fimViagem}
Data Cupom: ${d.dataCupom}
Categoria: ${d.categoria}
Descrição: ${d.descricao}
Valor: R$ ${parseFloat(d.valor).toFixed(2)}
          `,
          10,
          y
        );

        y += 45;

        if (y > 250) {

          doc.addPage();

          y = 10;
        }
      });

      doc.save("despesas.pdf");
    }

  </script>

</body>

</html>
