<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Despesas</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.section-title{
    margin-top:20px;
    margin-bottom:10px;
    font-size:18px;
    font-weight:bold;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

label{
    margin-bottom:5px;
    font-weight:bold;
}

input, select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

button{
    border:none;
    padding:12px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#007bff;
    color:white;
}

.primary:hover{
    background:#0056b3;
}

.success{
    background:#28a745;
    color:white;
}

.success:hover{
    background:#1f7a33;
}

.danger{
    background:red;
    color:white;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th,
table td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

table th{
    background:#efefef;
}

img{
    width:70px;
    border-radius:6px;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
    flex-wrap:wrap;
}

.total{
    margin-top:20px;
    font-size:22px;
    text-align:right;
    font-weight:bold;
}

@media(max-width:768px){

    table{
        display:block;
        overflow-x:auto;
    }

}

</style>
</head>

<body>

<div class="container">

<h1>Controle de Despesas de Viagem</h1>

<div class="section-title">Dados da Viagem</div>

<div class="form-grid">

    <div class="field">
        <label>Funcionário</label>
        <input type="text" id="funcionario">
    </div>

    <div class="field">
        <label>Cliente</label>
        <input type="text" id="cliente">
    </div>

    <div class="field">
        <label>Data Início</label>
        <input type="date" id="dataInicio">
    </div>

    <div class="field">
        <label>Data Final</label>
        <input type="date" id="dataFim">
    </div>

</div>

<div class="section-title">Nova Despesa</div>

<div class="form-grid">

    <div class="field">
        <label>Data do Cupom</label>
        <input type="date" id="dataCupom">
    </div>

    <div class="field">
        <label>Categoria</label>
        <select id="categoria">
            <option>Refeição</option>
            <option>Hotel</option>
            <option>Combustível</option>
            <option>Pedágio</option>
            <option>Táxi/Uber</option>
            <option>Outros</option>
        </select>
    </div>

    <div class="field">
        <label>Descrição</label>
        <input list="historicoDescricao" type="text" id="descricao">
        <datalist id="historicoDescricao"></datalist>
    </div>

    <div class="field">
        <label>Valor</label>
        <input type="number" step="0.01" id="valor">
    </div>

    <div class="field">
        <label>Cupom Fiscal</label>
        <input type="file" id="imagem" accept="image/*">
    </div>

</div>

<div class="actions">

    <button class="primary" onclick="salvarDespesa()">
        Salvar Despesa
    </button>

    <button class="success" onclick="exportarExcel()">
        Exportar Excel
    </button>

    <button class="success" onclick="exportarPDF()">
        Exportar PDF
    </button>

</div>

<table>

<thead>
<tr>
    <th>Funcionário</th>
    <th>Cliente</th>
    <th>Período</th>
    <th>Data Cupom</th>
    <th>Categoria</th>
    <th>Descrição</th>
    <th>Valor</th>
    <th>Cupom</th>
    <th>Ação</th>
</tr>
</thead>

<tbody id="tabelaDespesas"></tbody>

</table>

<div class="total" id="total">
    Total: R$ 0,00
</div>

</div>

<script>

let despesas = JSON.parse(localStorage.getItem("despesas")) || [];
let descricoes = JSON.parse(localStorage.getItem("descricoes")) || [];

renderizarTabela();
renderizarDescricoes();

function primeiraMaiuscula(texto){

    texto = texto.toLowerCase();

    return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function salvarDespesa(){

    const funcionario = primeiraMaiuscula(
        document.getElementById("funcionario").value
    );

    const cliente = primeiraMaiuscula(
        document.getElementById("cliente").value
    );

    const dataInicio = document.getElementById("dataInicio").value;
    const dataFim = document.getElementById("dataFim").value;

    const dataCupom = document.getElementById("dataCupom").value;

    const categoria = document.getElementById("categoria").value;

    const descricao = primeiraMaiuscula(
        document.getElementById("descricao").value
    );

    const valor = document.getElementById("valor").value;

    const imagemInput = document.getElementById("imagem");

    if(
        !funcionario ||
        !cliente ||
        !dataInicio ||
        !dataFim ||
        !dataCupom ||
        !valor
    ){
        alert("Preencha os campos obrigatórios");
        return;
    }

    if(!descricoes.includes(descricao)){

        descricoes.push(descricao);

        localStorage.setItem(
            "descricoes",
            JSON.stringify(descricoes)
        );

        renderizarDescricoes();
    }

    const reader = new FileReader();

    reader.onload = function(){

        const despesa = {

            funcionario,
            cliente,
            dataInicio,
            dataFim,
            dataCupom,
            categoria,
            descricao,
            valor,
            imagem: reader.result

        };

        despesas.push(despesa);

        localStorage.setItem(
            "despesas",
            JSON.stringify(despesas)
        );

        renderizarTabela();

        limparFormulario();
    }

    if(imagemInput.files[0]){

        reader.readAsDataURL(imagemInput.files[0]);

    }else{

        reader.onload();
    }

}

function renderizarDescricoes(){

    const lista = document.getElementById("historicoDescricao");

    lista.innerHTML = "";

    descricoes.forEach(item => {

        lista.innerHTML += `
            <option value="${item}">
        `;
    });

}

function renderizarTabela(){

    const tabela = document.getElementById("tabelaDespesas");

    tabela.innerHTML = "";

    let total = 0;

    despesas.forEach((despesa, index) => {

        total += parseFloat(despesa.valor);

        tabela.innerHTML += `

        <tr>

            <td>${despesa.funcionario}</td>

            <td>${despesa.cliente}</td>

            <td>
                ${despesa.dataInicio}
                até
                ${despesa.dataFim}
            </td>

            <td>${despesa.dataCupom}</td>

            <td>${despesa.categoria}</td>

            <td>${despesa.descricao}</td>

            <td>
                R$ ${parseFloat(despesa.valor).toFixed(2)}
            </td>

            <td>

                ${
                    despesa.imagem
                    ? `<img src="${despesa.imagem}">`
                    : `Sem imagem`
                }

            </td>

            <td>

                <button
                    class="danger"
                    onclick="removerDespesa(${index})"
                >
                    Excluir
                </button>

            </td>

        </tr>

        `;
    });

    document.getElementById("total").innerHTML =
        `Total: R$ ${total.toFixed(2)}`;
}

function removerDespesa(index){

    if(confirm("Deseja remover esta despesa?")){

        despesas.splice(index,1);

        localStorage.setItem(
            "despesas",
            JSON.stringify(despesas)
        );

        renderizarTabela();
    }

}

function limparFormulario(){

    document.getElementById("dataCupom").value = "";
    document.getElementById("descricao").value = "";
    document.getElementById("valor").value = "";
    document.getElementById("imagem").value = "";
}

function exportarExcel(){

    const worksheet = XLSX.utils.json_to_sheet(despesas);

    const workbook = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "Despesas"
    );

    XLSX.writeFile(
        workbook,
        "despesas_viagem.xlsx"
    );
}

async function exportarPDF(){

    const { jsPDF } = window.jspdf;

    const doc = new jsPDF();

    doc.setFontSize(16);

    doc.text(
        "Relatório de Despesas",
        10,
        10
    );

    let y = 25;

    despesas.forEach((d,index)=>{

        doc.setFontSize(10);

        doc.text(
            `${index + 1}. ${d.funcionario} | ${d.cliente}`,
            10,
            y
        );

        y += 6;

        doc.text(
            `Período: ${d.dataInicio} até ${d.dataFim}`,
            10,
            y
        );

        y += 6;

        doc.text(
            `Cupom: ${d.dataCupom}`,
            10,
            y
        );

        y += 6;

        doc.text(
            `Categoria: ${d.categoria}`,
            10,
            y
        );

        y += 6;

        doc.text(
            `Descrição: ${d.descricao}`,
            10,
            y
        );

        y += 6;

        doc.text(
            `Valor: R$ ${d.valor}`,
            10,
            y
        );

        y += 10;

        if(y > 260){

            doc.addPage();

            y = 20;
        }

    });

    doc.save("despesas_viagem.pdf");
}

</script>

</body>
</html>
